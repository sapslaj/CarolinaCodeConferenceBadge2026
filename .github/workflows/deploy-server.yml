name: Deploy server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker build
        run: docker build -f server/Dockerfile -t "oci.sapslaj.xyz/badge-hub:$(git rev-parse --short HEAD)" .

      - name: Docker push
        run: docker push "oci.sapslaj.xyz/badge-hub:$(git rev-parse --short HEAD)"

      - name: Point kustomization at the new image
        working-directory: server/k8s
        run: kustomize edit set image "oci.sapslaj.xyz/badge-hub=oci.sapslaj.xyz/badge-hub:$(git rev-parse --short HEAD)"

      - name: Apply
        run: kubectl apply -k server/k8s

      - name: Wait for rollout
        run: kubectl rollout status deployment/badge-hub -n badge-hub --timeout=120s
