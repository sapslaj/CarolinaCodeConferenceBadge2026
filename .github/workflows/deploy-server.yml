name: Deploy server

on:
  push:
    branches: [main]

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: oci.sapslaj.xyz/badge-hub:${{ steps.vars.outputs.tag }}

      - name: Set up kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Point kustomization at the new image
        working-directory: server/k8s
        run: kustomize edit set image "oci.sapslaj.xyz/badge-hub=oci.sapslaj.xyz/badge-hub:${{ steps.vars.outputs.tag }}"

      - name: Set up kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBECONFIG }}" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Apply
        run: kubectl apply -k server/k8s

      - name: Wait for rollout
        run: kubectl rollout status deployment/badge-hub -n badge-hub --timeout=120s
